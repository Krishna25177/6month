<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Storybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap">
<style>
:root{
  --cream:#fff7f0;--rose:#ff6f9f;--rose2:#ff9bbd;--plum:#5b3a52;--plum2:#8a6480;
  --lav:#a98bf0;--mint:#6fd1b4;--sun:#ffc95c;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --hand:'Caveat','Segoe Script',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--cream);color:var(--plum);font:400 16px/1.5 var(--display);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}

/* ---------- book + page turn ---------- */
#pages{position:fixed;inset:0;perspective:1700px;perspective-origin:20% 50%;background:#f3d9e6}
.page{position:absolute;inset:0;display:none;overflow-x:hidden;overflow-y:auto;transform-origin:left center;backface-visibility:hidden;background:var(--bg)}
.page::before{content:"";position:fixed;left:0;top:0;bottom:0;width:16px;background:linear-gradient(90deg,rgba(91,58,82,.18),transparent);pointer-events:none;z-index:2}
.page.active{display:block;z-index:1}
.page.out{z-index:3;animation:turnOut .85s cubic-bezier(.55,.05,.35,1) forwards;pointer-events:none}
.page.back{z-index:3;animation:turnIn .85s cubic-bezier(.35,.05,.45,1) both;pointer-events:none}
@keyframes turnOut{0%{transform:rotateY(0);filter:brightness(1)}60%{filter:brightness(.93)}100%{transform:rotateY(-118deg);filter:brightness(.8);opacity:0}}
@keyframes turnIn{0%{transform:rotateY(-118deg);opacity:0;filter:brightness(.8)}35%{opacity:1}100%{transform:rotateY(0);filter:brightness(1)}}
.bg0{--bg:linear-gradient(160deg,#ffd3e5,#e4d6ff)}
.bg1{--bg:linear-gradient(180deg,#d7f0ff 0%,#fff0f6 72%)}
.bg2{--bg:radial-gradient(circle at 20% 15%,#fff 0 2px,transparent 3px) 0 0/34px 34px,linear-gradient(180deg,#fff4ea,#ffe3ee)}
.bg3{--bg:linear-gradient(180deg,#dff2ff,#e6ffe9)}
.bg4{--bg:linear-gradient(180deg,#fbd2e6,#dcd2ff)}
.bg5{--bg:linear-gradient(180deg,#c9ecff,#ffeef2)}
.bg6{--bg:linear-gradient(180deg,#ffdfe6,#fff2d6)}
.bg7{--bg:linear-gradient(180deg,#2a2159,#6a3d8f 62%,#f0899e)}
.inner{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:56px max(18px,env(safe-area-inset-right,0px)) 110px max(18px,env(safe-area-inset-left,0px))}
.kick{margin:0;font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--plum2)}
h1,h2{margin:0;font-weight:600;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.6rem,12vw,4.2rem);color:var(--plum)}
h2{font-size:clamp(1.8rem,8vw,2.6rem)}
.sub{margin:0;color:var(--plum2);text-wrap:balance}
.dark .kick,.dark .sub{color:#e6d6ff}.dark h1,.dark h2{color:#fff}

/* reveal */
.rv{opacity:0}
.page.show .rv{animation:rv .9s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*.32s + .55s)}
@keyframes rv{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* shayari card */
.card{position:relative;width:100%;background:#fffdf8;border-radius:18px;padding:22px 22px 18px;box-shadow:0 12px 30px rgba(120,60,100,.2);transform:rotate(-1.2deg)}
.card::before{content:"";position:absolute;top:-10px;left:50%;width:86px;height:22px;background:rgba(255,155,189,.6);transform:translateX(-50%) rotate(-3deg);border-radius:3px}
.card p{margin:0;font:700 1.7rem/1.35 var(--hand);color:var(--plum)}
.card p+p{margin-top:2px}
.card b{font-weight:700;background:linear-gradient(transparent 58%,#ffc4da 58%) no-repeat;background-size:0 100%}
.page.show .card b{animation:hl .8s 1.9s forwards}
@keyframes hl{to{background-size:100% 100%}}
.card .by{font-size:1.2rem;color:var(--plum2);text-align:right;margin-top:8px}

/* buttons */
.btn{border:0;border-radius:999px;padding:12px 26px;font-weight:600;background:#fff;color:var(--plum);box-shadow:0 6px 16px rgba(120,60,100,.22);transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,#ff7aa8,#b79cff);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
#music{position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:1.1rem}
#music.off{opacity:.55;text-decoration:line-through}

/* nav */
#bar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.nb{width:50px;height:50px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(120,60,100,.28);font-size:1.5rem;line-height:1;display:grid;place-items:center;color:var(--rose)}
.nb:disabled{opacity:.35}
.nb.next{background:linear-gradient(135deg,#ff7aa8,#b79cff);color:#fff;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px) scale(1.06)}}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(91,58,82,.25);transition:all .3s}
.dots i.on{background:var(--rose);width:22px;border-radius:6px}

/* fx */
#fx,#amb{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx{z-index:50}
#amb{z-index:10}
.pt{position:fixed;font-size:18px;line-height:1;pointer-events:none;will-change:transform,opacity}
.petal{position:absolute;top:-30px;width:14px;height:14px;background:linear-gradient(135deg,#ffb3cf,#ff7aa8);border-radius:100% 0 100% 0;opacity:.8;animation:fall linear infinite,sway ease-in-out infinite alternate}
@keyframes fall{to{top:105vh}}
@keyframes sway{from{margin-left:-24px;rotate:-30deg}to{margin-left:24px;rotate:40deg}}
.bf{position:absolute;left:0;top:0;width:44px;height:38px;will-change:transform}
.bf svg,.gb svg,.dbf svg{display:block;width:100%;height:100%;overflow:visible}
.wings{transform-origin:30px 25px;animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.22)}}

/* clouds + hills */
.cloud{position:absolute;width:92px;height:28px;background:#fff;border-radius:30px;opacity:.85;animation:drift 55s linear infinite;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:46px;height:46px;top:-22px;left:14px}
.cloud::after{width:58px;height:58px;top:-32px;right:12px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
.hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:200px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#c8f2d4,#a5e4bd);pointer-events:none}

/* cover */
.seal{position:relative;width:132px;height:132px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9bbd,#ff5d92);box-shadow:0 10px 26px rgba(255,93,146,.5);color:#fff;display:grid;place-items:center;animation:beat 1.6s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:9px;border:2px dashed rgba(255,255,255,.7);border-radius:50%}
.seal span{font-size:3.2rem;line-height:1}
.seal small{position:absolute;bottom:20px;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* bunnies */
.duo{display:flex;justify-content:center;align-items:flex-end;gap:6px;width:100%}
.bn{position:relative;width:min(40vw,176px);cursor:pointer;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.bi{animation:bob 3s ease-in-out infinite}
.bn:nth-child(2) .bi{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-7px)}}
.bi.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(0) scaleY(1)}25%{transform:translateY(4px) scaleY(.9)}60%{transform:translateY(-34px) scaleY(1.08)}100%{transform:translateY(0) scaleY(1)}}
.bn svg{width:100%;height:auto;display:block;overflow:visible}
.earL,.earR{transform-box:fill-box;transform-origin:50% 100%;animation:wig 5s infinite}
.earR{animation-delay:-2.4s}
@keyframes wig{0%,84%,100%{rotate:0deg}88%{rotate:-9deg}93%{rotate:6deg}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.blush{transform-box:fill-box;transform-origin:center;transition:all .3s}
.bn.shy .blush{opacity:1;transform:scale(1.35)}
.armL,.armR{transform-box:fill-box;transform-origin:50% 0;transition:rotate .5s}
.duo.hug .bn:first-child{transform:translateX(24%) rotate(5deg)}
.duo.hug .bn:last-child{transform:translateX(-24%) rotate(-5deg)}
.duo.hug .armL{rotate:-70deg}.duo.hug .armR{rotate:70deg}
.tag{display:inline-block;margin-top:4px;padding:2px 14px;border-radius:999px;background:#fff;box-shadow:0 4px 10px rgba(120,60,100,.18);font-weight:600;font-size:.95rem}
.bub{position:absolute;left:50%;bottom:92%;background:#fff;padding:5px 14px;border-radius:16px;font-weight:600;white-space:nowrap;box-shadow:0 6px 14px rgba(120,60,100,.22);animation:bubPop 1.4s both;pointer-events:none;z-index:5;color:var(--plum)}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
@keyframes bubPop{0%{transform:translateX(-50%) scale(0)}14%{transform:translateX(-50%) scale(1.18)}24%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{transform:translateX(-50%) translateY(-12px);opacity:0}}
.duo.enter .bn:first-child{animation:inL 1.1s cubic-bezier(.3,1.4,.5,1) both}
.duo.enter .bn:last-child{animation:inR 1.1s cubic-bezier(.3,1.4,.5,1) both}
@keyframes inL{from{transform:translateX(-90vw) rotate(-14deg)}to{transform:none}}
@keyframes inR{from{transform:translateX(90vw) rotate(14deg)}to{transform:none}}

/* decorative CSS butterflies */
.dbf{position:absolute;width:40px;height:34px;animation:wander 9s ease-in-out infinite;pointer-events:none}
@keyframes wander{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(70px,-34px) rotate(12deg)}50%{transform:translate(20px,-80px) rotate(-6deg)}75%{transform:translate(-60px,-30px) rotate(10deg)}}

/* catch game */
.meadow{position:relative;width:100%;height:34svh;min-height:240px;border-radius:26px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7);overflow:hidden}
.gb{position:absolute;left:0;top:0;width:58px;height:50px;border:0;background:none;padding:0;will-change:transform}
.hr{display:flex;gap:8px}
.hr i{font-style:normal;font-size:1.5rem;color:rgba(91,58,82,.22);transition:all .4s}
.hr i.on{color:var(--rose);transform:scale(1.2)}
.poem{width:100%;min-height:132px;text-align:center}
.poem p{margin:0;font:700 1.45rem/1.35 var(--hand);animation:lineIn .8s both}
@keyframes lineIn{from{opacity:0;transform:translateY(10px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}

/* photos */
.lights{position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none}
.lights svg{width:100%;height:100%;display:block}
.bulb{animation:twk 1.6s ease-in-out infinite}
@keyframes twk{50%{opacity:.35}}
.hangs{display:flex;gap:14px;justify-content:center;width:100%;margin-top:34px}
.hang{position:relative;width:46%;max-width:190px;background:#fff;padding:8px 8px 6px;border-radius:5px;box-shadow:0 10px 24px rgba(91,58,82,.28);transform-origin:50% -26px;animation:swing 4s ease-in-out infinite;cursor:pointer}
.hang:nth-child(2){animation-delay:-2s;margin-top:26px}
.hang::before{content:"";position:absolute;left:50%;top:-14px;width:16px;height:24px;margin-left:-8px;background:#ffb04d;border-radius:4px}
.hang::after{content:"";position:absolute;left:50%;top:-44px;width:2px;height:32px;background:var(--plum2)}
.hang img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;background:#eee}
.hang span{display:block;font:700 1.15rem var(--hand);margin-top:3px;color:var(--plum)}
@keyframes swing{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.hang.big{animation:swingBig 1.5s ease-out}
@keyframes swingBig{0%{rotate:0}15%{rotate:-18deg}35%{rotate:15deg}55%{rotate:-9deg}75%{rotate:5deg}100%{rotate:0}}

/* balloons */
.sky6{position:relative;width:100%;height:42svh;min-height:280px}
.bl{position:absolute;bottom:0;width:60px;border:0;background:none;padding:0;animation:rise 1.5s cubic-bezier(.2,.9,.3,1) both,bobl 4s ease-in-out infinite;animation-delay:calc(var(--k)*.16s + .6s),calc(var(--k)*-.7s)}
.bl svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes rise{from{transform:translateY(75vh)}to{transform:translateY(0)}}
@keyframes bobl{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -14px;rotate:4deg}}
.msg{width:100%;min-height:96px;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 10px 24px rgba(91,58,82,.18);display:flex;flex-direction:column;justify-content:center;gap:2px}
.msg b{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.msg p{margin:0;font:700 1.5rem/1.3 var(--hand)}
.msg.pop{animation:msgPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes msgPop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* hug */
.meter{position:relative;width:100%;max-width:300px;height:16px;border-radius:10px;background:rgba(255,255,255,.7);box-shadow:inset 0 2px 4px rgba(91,58,82,.15)}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:linear-gradient(90deg,#ff9bbd,#ff5d92);transition:width .4s}
.meter span{position:absolute;top:-14px;left:0;font-size:1.5rem;line-height:1;color:var(--rose);transform:translateX(-50%);transition:left .4s}

/* finale */
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twk 2.4s ease-in-out infinite}
.cake{display:block;margin:0 auto}
.cake .flame{transform-box:fill-box;transform-origin:center bottom;animation:flick .6s ease-in-out infinite alternate;transition:opacity .4s}
.cake.out .flame{opacity:0;animation:none}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.9,1.15) rotate(4deg)}}
.shoot{position:fixed;z-index:49;width:130px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff);pointer-events:none}
.chip{display:inline-block;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-size:.8rem;margin:2px}
.finale-line{margin:0;font:700 1.55rem/1.35 var(--hand);color:#fff}
.bounce{animation:bounceT 2.4s ease-in-out infinite}
@keyframes bounceT{50%{transform:translateY(-8px) rotate(-1.5deg)}}

@media (prefers-reduced-motion:reduce){
  .rv{opacity:1}
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="pages"></div>
<div id="amb" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<button id="music" class="btn" aria-label="Toggle sound" hidden>♫</button>
<nav id="bar" hidden>
  <button class="nb" id="prev" aria-label="Previous page">‹</button>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button class="nb next" id="next" aria-label="Next page">›</button>
</nav>

<script>
(function(){
'use strict';

/* =====================================================
   EDIT YAHAN: sab kuch apne hisaab se badaliye
   ===================================================== */
var CONFIG={
  toName:'  wifee ji😘💋',                // unka naam ya nickname
  fromName:'husband ji😘💋',      // aapka naam
  since:'2026-05-08',           // shuruaat ki date (YYYY-MM-DD)

  // Photos: folder "photos" me 1.jpg, 2.jpg rakhiye. Na ho to placeholder dikhega.
  photos:[
    {src:'photo1.png.png', cap:'just us'},
    {src:'photo2.png.png', cap:'that laugh of yours'}
  ],

  // Shayari 1 (page 3). Kisi shabd ko chamkane ke liye *star* ke andar likhiye.
  shayari1:['Aapka aana, jaise *mausam* ka badal jaana,','dil ko mil gaya ek *naya thikaana*.'],
  // Shayari 2 (photo page)
  shayari2:['Har tasveer me ek hi baat *saaf* hai,','aa[ke] saath har pal *khaas* hai.'],
  // Shayari 3 (jhappi page)
  shayari3:['Aapki baahon me jo *sukoon* hai,','wo kisi manzil, kisi manzar me nahi.'],
  // Aakhri shayari (finale)
  shayari4:['Chhe mahine ki ye pyaari kahani,','aage ki baaki hai poori zindagaani.'],

  // 6 titliyan pakadne par ek ek line khulti hai (kul 6 lines)
  butterflyLines:[
    'Chhe mahine beete, jaise chhe pal ki baat,',
    'har din aapke saath, ek nayi sougaat.',
    'Hansi aapki, meri sabse pyaari dua,',
    'tumse hi roshan mera har ek ujaala.',
    'Titliyon ki tarah ud gaya mera dil,',
    'aur aapke baahon me jaakar mila manzil.'
  ],
  // 6 gubbare, har mahine ka ek
  months:[
    'Pehli mulaqat: dil ne kaha, ye khaas hai.',
    'Roz ki baatein, ab meri aadat ban gayi.',
    'Tumhari hansi, meri favourite awaaz.',
    'Ladte bhi hain, par saath hi rehte hain.',
    'Tum ho to har din kuch special hai.',
    'Aaj chhe mahine, aur dil kehta hai: aur chahiye!'
  ]
};
/* ===================================================== */

var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var rnd=function(a,b){return a+Math.random()*(b-a)};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var hl=function(s){return esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>')};
var REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
var fx=$('#fx'),amb=$('#amb');

/* ---------- placeholder photos ---------- */
var phCache={};
function placeholder(i){
  i=i%6;if(phCache[i])return phCache[i];
  var c=document.createElement('canvas');c.width=c.height=500;var x=c.getContext('2d');
  var h=[335,225,280,200,310,250][i];
  var g=x.createLinearGradient(0,0,0,500);g.addColorStop(0,'hsl('+h+',80%,82%)');g.addColorStop(1,'hsl('+(h+40)+',85%,70%)');
  x.fillStyle=g;x.fillRect(0,0,500,500);
  x.fillStyle='hsla('+h+',60%,45%,.4)';x.beginPath();x.moveTo(0,500);x.lineTo(0,380);x.quadraticCurveTo(125,300,250,380);x.quadraticCurveTo(375,450,500,350);x.lineTo(500,500);x.fill();
  x.fillStyle='#ff6f9f';x.font='200px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('♥',250,210);
  x.fillStyle='rgba(91,58,82,.8)';x.font='italic 28px Georgia,serif';x.fillText('add your photo',250,450);
  return phCache[i]=c.toDataURL('image/jpeg',.85);
}
function photo(i){
  var p=CONFIG.photos[i%CONFIG.photos.length],im=new Image();
  im.alt=p.cap||'';im.onerror=function(){im.onerror=null;im.src=placeholder(i)};im.src=p.src||placeholder(i);return im;
}

/* ---------- sound ---------- */
var ac=null,master=null,musicOn=false,musicTimer=null;
var NOTES=[523.25,587.33,659.25,783.99,880,1046.5];
function tone(f,t,dur,vol,type){try{var o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}catch(e){}}
function startMusic(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    if(!master){master=ac.createGain();master.gain.value=.55;master.connect(ac.destination)}
    musicOn=true;$('#music').classList.remove('off');
    var pat=[0,2,4,2,1,3,5,3,0,2,4,5,4,2,1,0],s=0;clearInterval(musicTimer);
    musicTimer=setInterval(function(){var t=ac.currentTime+.04;tone(NOTES[pat[s%16]],t,.9,.05);if(s%8===0)tone(NOTES[0]/2,t,1.8,.05,'sine');s++},360);
  }catch(e){}

      var p=document.createElement('p');p.textContent=CONFIG.butterflyLines[caught%CONFIG.butterflyLines.length];poem.appendChild(p);
      $$('#hr i')[caught].classList.add('on');caught++;
      if(caught===6){sfx('chime');petals(22);hearts(14);var f=document.createElement('p');f.style.color='#ff6f9f';f.textContent='Sab titliyan mil gayi ♥ Agle page par chalo';poem.appendChild(f)}
    }})(w,b));
  }
  var last=performance.now();
  (function loop(t){var dt=Math.min(.05,(t-last)/1000);last=t;gameBfs.forEach(function(w){if(!w.done)stepWander(w,W,H,dt)});raf=requestAnimationFrame(loop)})(last);
}
/* ambient butterflies loop */
(function(){
  if(REDUCED)return;var last=performance.now();
  (function loop(t){var dt=Math.min(.05,(t-last)/1000);last=t;ambient.forEach(function(w){stepWander(w,innerWidth,innerHeight,dt)});
    requestAnimationFrame(loop)})(last);
})();

/* ---------- page 4: photos ---------- */
function initPhotos(){
  var h=$('#hangs');if(h.dataset.ready)return;h.dataset.ready='1';
  [0,1].forEach(function(i){
    var d=document.createElement('div');d.className='hang';d.appendChild(photo(i));
    var s=document.createElement('span');s.textContent=CONFIG.photos[i%CONFIG.photos.length].cap||'';d.appendChild(s);
    d.addEventListener('click',function(){d.classList.remove('big');void d.offsetWidth;d.classList.add('big');setTimeout(function(){d.classList.remove('big')},1500);var r=d.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,12,['♥','✦'],PINKS,90);sfx('chime')});
    h.appendChild(d);
  });
}

/* ---------- page 5: balloons ---------- */
function initBalloons(){
  var s=$('#sky6');s.innerHTML='';var msg=$('#msg'),popped=0;
  msg.innerHTML='<b>tap a balloon</b><p>Har gubbare me ek yaad chhupi hai ♥</p>';
  var cols=['#ff6f9f','#b79cff','#6fd1b4','#ffc95c','#7ec8ff','#ff8f8f'],lefts=[2,18,34,50,66,82],lifts=[30,0,55,10,40,0];
  cols.forEach(function(c,k){
    var b=document.createElement('button');b.className='bl';b.style.setProperty('--k',k);b.style.left=lefts[k]+'%';b.style.bottom=lifts[k]+'px';b.setAttribute('aria-label','Month '+(k+1)+' balloon');b.innerHTML=balloon(c,'M'+(k+1));s.appendChild(b);
    b.addEventListener('pointerdown',function(e){
      e.stopPropagation();var r=b.getBoundingClientRect();
      burst(r.left+r.width/2,r.top+r.height*.35,16,['●','♥','✦'],[c,'#fff','#ffb3cf'],120);sfx('pop');b.remove();popped++;
      msg.innerHTML='<b>Month '+(k+1)+'</b><p>'+esc(CONFIG.months[k])+'</p>';msg.classList.remove('pop');void msg.offsetWidth;msg.classList.add('pop');
      if(popped===6){setTimeout(function(){sfx('chime');hearts(16);petals(16)},500)}
    });
  });
}

/* ---------- page 6: hug ---------- */
var love=0;
function setMeter(v){var m=$('#meter');$('i',m).style.width=v+'%';$('span',m).style.left=clamp(v,4,96)+'%'}
function initHug(){love=0;setMeter(0);var d=$('#duo2');d.classList.remove('hug');$('#hugHint').textContent='Bunnies par tap karte raho, love meter bharo!'}
$('#duo2').addEventListener('click',function(e){
  bunnyTap(e,function(){
    if($('#duo2').classList.contains('hug'))return;
    love=Math.min(100,love+14);setMeter(love);
    if(love>=100)setTimeout(doHug,350);
  });
});
function doHug(){
  var d=$('#duo2');d.classList.add('hug');sfx('hug');hearts(26);petals(10);
  var r=d.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.4,26,['♥','♥','✦'],PINKS,150);
  $('#hugHint').textContent='Jhappi complete! ♥';
}

/* ---------- page 7: finale ---------- */
function initFinale(){
  var st=$('#stars');if(!st.children.length){for(var i=0;i<46;i++){var s=document.createElement('i');s.style.left=rnd(0,100)+'%';s.style.top=rnd(0,70)+'%';s.style.animationDelay='-'+rnd(0,3)+'s';s.style.transform='scale('+rnd(.6,1.6)+')';st.appendChild(s)}}
  $('#cakeSvg').classList.remove('out');var w=$('#wish');w.disabled=false;w.innerHTML='Blow &amp; make a wish ✦';
}
function shootingStar(){
  if(REDUCED)return;var el=document.createElement('div');el.className='shoot';el.style.left=rnd(50,90)+'vw';el.style.top=rnd(4,22)+'vh';document.body.appendChild(el);
  var an=el.animate([{transform:'rotate(30deg) translateX(0)',opacity:0},{opacity:1,offset:.2},{transform:'rotate(30deg) translateX(-'+(innerWidth*.9)+'px)',opacity:0}],{duration:1400,easing:'ease-in'});
  an.onfinish=function(){el.remove()};
}
$('#wish').addEventListener('click',function(){
  $('#cakeSvg').classList.add('out');this.disabled=true;this.textContent='Wish made ♥';sfx('hug');
  shootingStar();setTimeout(shootingStar,500);
  [0,350,700,1100,1500].forEach(function(t){setTimeout(function(){burst(rnd(60,innerWidth-60),rnd(80,innerHeight*.55),22,['♥','✦','✧','❀'],PINKS.concat(['#fff']),150)},t)});
  hearts(30);petals(20);
});
$('#replay').addEventListener('click',function(){
  var n=cur;cur=0;busy=false;
  pages.forEach(function(p,i){p.classList.remove('active','show','out','back');if(i===0)p.classList.add('active','show')});
  cur=0;updateDots();petals(12);
});
})();
</script>
